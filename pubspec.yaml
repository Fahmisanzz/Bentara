name: bentara
description: "A new Flutter project for BENTARA application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.1
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0
  hive_flutter: ^1.1.0
  uuid: ^4.3.3

  speech_to_text: ^7.4.0
  flutter_tts: ^4.0.2
  permission_handler: ^11.3.1
  camera: ^0.10.5
  tflite_flutter: ^0.12.1
  image: ^4.9.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/ml/
